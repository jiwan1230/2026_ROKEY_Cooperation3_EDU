[pytest]
testpaths = tests
python_files = test_*.py

# 주의: 위 두 설정(testpaths/python_files)은 테스트 경로/파일 패턴 지정일 뿐,
# 이 환경의 pytest 플러그인 자동 로드 충돌을 해결하지 못한다. pytest.ini만으로는
# 절대 조용히 해결되지 않으니 착각하지 말 것.
#
# 실제 원인: 이 컴퓨터는 ROS2 humble이 전역으로 source되어 있어 PYTHONPATH에
# /opt/ros/humble/lib/python3.10/site-packages가 포함된다. 그 안의
# launch_testing, launch_testing_ros_pytest_entrypoint 두 패키지가 pytest의
# setuptools entry-point 메커니즘으로 자동 플러그인 로드를 시도하면서 크래시한다
# (launch_testing: yaml 모듈 없음 -> ModuleNotFoundError, 두 번째 패키지는
# pytest_launch_collect_makemodule 훅 검증 실패 -> PluginValidationError).
# -p no:launch_testing / -p no:launch_testing_ros_pytest_entrypoint 로 개별
# 차단해도 훅 검증이 플러그인 로딩 초기 단계에서 일어나기 때문에 막히지 않는다.
#
# 유일하게 확실히 동작하는 해결책: pytest 실행 전에 환경변수
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 을 설정해 entry-point 플러그인 자동탐색
# 자체를 끄는 것. pytest.ini는 환경변수를 설정할 수 없으므로, 이 디렉터리에서는
# 항상 아래 명령으로 실행할 것 (자세한 내용은 같은 폴더의 README.md 참고):
#
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -v
